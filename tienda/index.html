<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>NAW Shop Editorial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:wght@400;500&family=Gruppo&display=swap">
<style>
/* NAW shop, editorial direction. Bone page, taupe type, matcha bar and panels with ink text, ink bands and footer; gold only in the logo and on ink.
   Three homepage heroes to compare: 1 triptych, 2 split, 3 full-width banner with the type on the sky. */
:root {
  --bone: #f1efe9;
  --ink: #141414;
  --taupe: #695440;
  --gold: #c8a35a;
  --stone: #d9d4c8;
  --matcha: #d3d9be;
  --placeholder: #e2dfd6;
  --hair: rgba(20, 20, 20, 0.12);
  --edge: rgba(105, 84, 64, 0.5);
  --on-ink-soft: #9b988f;
  --on-ink-line: rgba(241, 239, 233, 0.16);
  --sky-shade: rgba(14, 30, 70, 0.35);
  --pick-bg: rgba(20, 20, 20, 0.9);
  --pick-fg: #f1efe9;
  --pick-dim: #9b988f;

  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --label: Gruppo, "Helvetica Neue", Arial, sans-serif;
  --digits: "EB Garamond", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --gut: 32px;
  --wrap: 1280px;
  color-scheme: light;
}
@media (max-width: 599px) { :root { --gut: 18px; } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bone); color: var(--taupe); font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bone); }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; } }

.wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
.label { font-family: var(--label); font-size: 14px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; line-height: 1.3; }
.num { font-family: var(--digits); font-variant-numeric: lining-nums tabular-nums; letter-spacing: 0.03em; }
.fig9 { font-family: var(--digits); font-style: normal; font-size: 0.9em; letter-spacing: 0.04em; }
.double { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 0.95; letter-spacing: -0.01em; text-wrap: balance; }
.double em { font-style: italic; }
.note { margin: 0; font-size: 15px; opacity: 0.85; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border: 1px solid var(--ink); background: var(--ink); color: var(--bone); font-family: var(--label); font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; transition: opacity 0.2s ease, transform 0.12s ease; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn--bone { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.btn--full { width: 100%; }
.media { position: relative; overflow: hidden; background: var(--placeholder); }
.media img { width: 100%; height: 100%; object-fit: cover; }

.sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.size { min-width: 84px; height: 46px; padding: 0 16px; border: 1px solid var(--edge); background: transparent; font-family: var(--label); font-size: 14px; letter-spacing: 0.16em; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.size:hover { border-color: var(--taupe); }
.size[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bone); }
.swatches { display: flex; gap: 12px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--hair); box-shadow: 0 0 0 3px var(--bone); }
.sw[aria-current="true"] { outline: 1px solid var(--taupe); outline-offset: 4px; }
.acc { border-top: 1px solid var(--hair); }
.acc:last-child { border-bottom: 1px solid var(--hair); }
.acc summary { display: flex; justify-content: space-between; padding: 16px 0; cursor: pointer; list-style: none; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-family: var(--digits); font-size: 20px; letter-spacing: 0; line-height: 1; }
.acc[open] summary::after { content: "\2212"; }
.acc p { margin: 0 0 16px; font-size: 17px; }

/* Header */
.bar { background: var(--matcha); color: var(--ink); text-align: center; padding: 9px 16px; font-family: var(--label); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bone); border-bottom: 1px solid var(--hair); }
.hdr__in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; }
.hdr__nav { display: flex; gap: 24px; }
.hdr__nav a:hover, .hdr__bag:hover { opacity: 0.65; }
.hdr__logo img { height: 26px; width: auto; }
.hdr__bag { justify-self: end; }
.hdr__menu { display: none; }

/* Hero 1 · triptych */
.h1 { display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 560px; }
.h1 .media { min-height: 420px; }
.h1 .mid { background: var(--matcha); color: var(--ink); display: grid; align-content: center; justify-items: center; gap: 22px; padding: 48px 28px; text-align: center; }
.h1 .mid .double { font-size: clamp(48px, 5vw, 84px); }

/* Hero 2 · split */
.h2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); min-height: 600px; }
.h2 .mid { background: var(--matcha); color: var(--ink); display: grid; align-content: center; gap: 22px; padding: 56px max(var(--gut), 4vw); }
.h2 .mid .double { font-size: clamp(52px, 5.4vw, 92px); }
.h2 .media img { object-position: 72% 50%; }

/* Hero 3 · banner, type on the sky */
.h3 { position: relative; aspect-ratio: 16 / 9; max-width: 100%; color: var(--bone); }
.h3 .media { position: absolute; inset: 0; }
.h3 .media img { object-position: 62% 60%; }
.h3 .sky { position: absolute; left: 0; right: 0; top: 0; padding-top: clamp(40px, 8vh, 88px); }
.h3 .sky .inner { display: grid; justify-items: start; gap: 18px; max-width: 560px; }
.h3 .sky .label { text-shadow: 0 1px 12px var(--sky-shade); }
.h3 .sky .double { font-size: clamp(56px, 7vw, 112px); text-shadow: 0 2px 24px var(--sky-shade); }

/* Slots, products, story, values */
.slots { padding-block: 64px 16px; }
.slots__row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.slot { aspect-ratio: 4 / 5; display: grid; place-items: center; background: var(--stone); border: 1px dashed var(--edge); color: var(--taupe); font: 13px/1.4 var(--ui); text-align: center; padding: 12px; }
.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 24px; }
.sec-h .double { font-size: clamp(34px, 3.4vw, 52px); white-space: nowrap; }
.prods { padding-block: 56px 72px; }
.prods__row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { display: grid; gap: 14px; }
.card .media { aspect-ratio: 4 / 5; }
.card .alt { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; }
@media (hover: hover) { .card:hover .alt { opacity: 1; } }
.card__meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: baseline; }
.card__t { margin: 0; font-size: 30px; font-weight: 400; line-height: 1; }
.card__t em { font-style: italic; }
.card__sub { grid-column: 1 / -1; margin: 0; font-size: 12px; }
.story { display: grid; grid-template-columns: 1.2fr 1fr; background: var(--ink); color: var(--bone); }
.story .media { min-height: 520px; }
.story__txt { display: grid; align-content: center; gap: 22px; padding: 56px max(var(--gut), 6vw); }
.story__txt .label:first-child { color: var(--gold); }
.story__txt .double { font-size: clamp(46px, 5vw, 80px); }
.vals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; padding-block: 64px; }
.vals p { margin: 8px 0 0; font-size: 22px; line-height: 1.25; }

/* Instagram slider */
.ig { padding-block: 8px 24px; }
.ig__h { display: grid; justify-items: center; gap: 10px; text-align: center; margin-bottom: 24px; }
.ig__h .double { font-size: clamp(30px, 3vw, 44px); }
.ig__row { overflow: hidden; touch-action: pan-y; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%); }
.ig__row::-webkit-scrollbar { display: none; }
.ig__row.is-drag { cursor: grabbing; }
.ig__track { display: flex; gap: 3px; width: max-content; will-change: transform; backface-visibility: hidden; transform: translate3d(0, 0, 0); }
.ig__row .media { flex: 0 0 clamp(220px, 24vw, 320px); aspect-ratio: 4 / 5; }

/* Bag dropdown */
.hdr__bag { justify-self: end; border: 0; background: none; padding: 12px 0; color: inherit; font-family: var(--label); font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; }
.hdr__bag[aria-expanded="true"] { text-decoration: underline; text-underline-offset: 6px; }
.bagp { position: fixed; z-index: 70; right: max(var(--gut), calc((100vw - var(--wrap)) / 2 + var(--gut))); width: min(400px, calc(100vw - 2 * var(--gut))); max-height: min(72vh, 640px); display: flex; flex-direction: column; background: var(--bone); border: 1px solid var(--hair); box-shadow: 0 18px 44px rgba(20, 20, 20, 0.14); opacity: 0; transform: translateY(-6px) scale(0.99); transform-origin: top right; visibility: hidden; transition: opacity 0.18s ease-out, transform 0.18s ease-out, visibility 0s linear 0.18s; }
.bagp.is-open { opacity: 1; transform: none; visibility: visible; transition: opacity 0.18s ease-out, transform 0.18s ease-out, visibility 0s; }
.bagp__head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 20px; border-bottom: 1px solid var(--hair); }
.bagp__head .label { font-size: 13px; }
.bagp__list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 20px; list-style: none; }
.bline { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.bline:last-child { border-bottom: 0; }
.bline .media { aspect-ratio: 4 / 5; }
.bline__t { margin: 0; font-size: 22px; font-weight: 400; line-height: 1; }
.bline__t em { font-style: italic; }
.bline__meta { margin: 6px 0 0; font-size: 12px; }
.qty { display: inline-flex; align-items: center; margin-top: 12px; border: 1px solid var(--edge); }
.qty button { width: 34px; height: 34px; padding: 0; border: 0; background: none; font-family: var(--digits); font-size: 19px; line-height: 1; transition: background-color 0.15s ease; }
.qty button:hover { background: var(--stone); }
.qty span { min-width: 28px; text-align: center; font-size: 16px; }
.bline__r { display: grid; justify-items: end; align-content: space-between; }
.linkbtn { border: 0; background: none; padding: 0; color: inherit; font-family: var(--label); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
.bagp__foot { display: grid; gap: 12px; padding: 16px 20px 20px; border-top: 1px solid var(--hair); }
.bagp__empty { display: grid; justify-items: start; gap: 14px; padding: 24px 20px 26px; }
.bagp__empty p { margin: 0; }
@keyframes lineIn { from { background: var(--matcha); } to { background: transparent; } }
.bline.is-new { animation: lineIn 1.2s ease-out; }
.ig__row img { pointer-events: none; -webkit-user-drag: none; transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
@media (hover: hover) { .ig__row .media:hover img { transform: scale(1.03); } }

/* Product page */
.pdp { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); padding-block: 20px 72px; }
.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-self: start; align-content: start; }
.gal .media { aspect-ratio: 4 / 5; }
.info { position: sticky; top: 96px; align-self: start; display: grid; gap: 20px; }
.info .double { font-size: clamp(44px, 4.4vw, 64px); }
.row { display: flex; justify-content: space-between; align-items: baseline; }
.other { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 16px; margin-top: 8px; }
.other .media { aspect-ratio: 4 / 5; }

/* Footer */
.ftr { background: var(--ink); color: var(--bone); margin-top: 56px; }
.ftr__in { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding-block: 56px 32px; }
.news { display: grid; gap: 14px; max-width: 460px; }
.news .double { font-size: clamp(32px, 3vw, 44px); }
.news__row { display: flex; gap: 8px; }
.news input { flex: 1; min-width: 0; height: 50px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--on-ink-line); background: transparent; color: var(--bone); font-size: 18px; }
.news input::placeholder { color: var(--on-ink-soft); }
.ftr__cols { display: flex; flex-wrap: wrap; gap: 40px; }
.ftr__cols div { display: grid; gap: 8px; align-content: start; }
.ftr__cols .label { color: var(--on-ink-soft); font-size: 12px; }
.ftr__base { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 20px 28px; border-top: 1px solid var(--on-ink-line); color: var(--on-ink-soft); font-family: var(--label); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }

/* Picker and toast (preview only) */
.pick { position: fixed; z-index: 80; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: calc(100% - 24px); padding: 6px; border-radius: 999px; background: var(--pick-bg); color: var(--pick-fg); font: 13px/1.2 var(--ui); box-shadow: 0 10px 30px rgba(20, 20, 20, 0.25); }
.pick__group { display: flex; gap: 2px; }
.pick__sep { width: 1px; height: 20px; background: var(--on-ink-line); }
.pick button { border: 0; background: transparent; color: var(--pick-dim); padding: 8px 12px; border-radius: 999px; white-space: nowrap; transition: background-color 0.15s ease, color 0.15s ease; }
.pick button:hover { color: var(--pick-fg); }
.pick button[aria-pressed="true"] { background: var(--pick-fg); color: var(--ink); }
.pick__note { position: fixed; z-index: 79; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 8px 14px; border-radius: 10px; background: var(--pick-bg); color: var(--pick-fg); font: 12.5px/1.4 var(--ui); text-align: center; transition: opacity 0.4s ease, transform 0.4s ease; }
.pick__note.is-off { opacity: 0; transform: translate(-50%, 6px); pointer-events: none; }
.toast { position: fixed; z-index: 81; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -12px); opacity: 0; padding: 12px 18px; background: var(--ink); color: var(--bone); font-family: var(--label); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
main { padding-bottom: 96px; }

@media (max-width: 899px) {
  .hdr__nav { display: none; }
  .hdr__menu { display: inline-block; }
  .h1 { grid-template-columns: 1fr 1fr; min-height: 0; }
  .h1 .mid { grid-column: 1 / -1; order: -1; }
  .h1 .media { min-height: 0; aspect-ratio: 4 / 5; }
  .h2 { grid-template-columns: 1fr; min-height: 0; }
  .h2 .media { aspect-ratio: 4 / 5; }
  .h2 .media img { object-position: 100% 50%; }
  .h3 { aspect-ratio: auto; height: 82svh; min-height: 560px; max-height: 760px; }
  .h3 .media img { object-position: 96% 50%; }
  .h3 .sky { padding-top: 26px; }
  .h3 .sky .inner { gap: 12px; }
  .h3 .sky .double { font-size: 52px; }
  .h3 .sky .btn { min-height: 46px; padding: 0 22px; font-size: 13px; }
  .slots__row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .story { grid-template-columns: 1fr; }
  .story .media { min-height: 0; aspect-ratio: 4 / 5; }
  .vals { grid-template-columns: 1fr; gap: 22px; }
  .pdp { grid-template-columns: 1fr; padding-top: 0; }
  .pdp > .gal { margin-inline: calc(-1 * max(var(--gut), env(safe-area-inset-left, 0px))); display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; scrollbar-width: none; }
  .pdp > .gal .media { flex: 0 0 86%; scroll-snap-align: start; }
  .info { position: static; }
  .ftr__in { grid-template-columns: 1fr; }
}
@media (max-width: 599px) { .prods__row { grid-template-columns: 1fr; gap: 40px; } .pick { border-radius: 18px; } .pick button { padding: 8px 9px; } .pick__note { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); } }
</style>

<main id="app" aria-live="polite"></main>
<div class="bagp" id="bagp" role="dialog" aria-labelledby="bagp-title" hidden></div>
<div class="toast" role="status" data-toast></div>
<p class="pick__note" data-note></p>
<nav class="pick" aria-label="Vista previa: portada y página">
  <div class="pick__group" role="group" aria-label="Portada">
    <button type="button" data-hero="1">Portada 1</button>
    <button type="button" data-hero="2">Portada 2</button>
    <button type="button" data-hero="3">Portada 3</button>
  </div>
  <span class="pick__sep" aria-hidden="true"></span>
  <div class="pick__group" role="group" aria-label="Página">
    <button type="button" data-p="home">Inicio</button>
    <button type="button" data-p="black">Black</button>
    <button type="button" data-p="matcha">Matcha</button>
  </div>
</nav>

<script>
(function () {
  'use strict';
  var IG = 'https://www.instagram.com/nawyoga/';
  var P = {
    black: {
      key: 'black', first: 'Black', title: 'Black set', price: '€95', swatch: '#141414', other: 'matcha', figure: 'gold',
      gallery: [['img/black-back.jpg', 'The black top turned over: the teardrop cut-out with the NAW logo below, the leggings beside it'], ['img/black-front.jpg', 'The black NAW set on cream boucle, the top seen from the front, plain'], ['img/black-chair-v3.jpg', 'The black set on a cream leather armchair with a matching cream leather cushion, the top showing its back and logo'], ['img/black-back-v2.jpg', 'The black set laid out casually on cream boucle, the top face down with the logo under the cut-out']]
    },
    matcha: {
      key: 'matcha', first: 'Matcha', title: 'Matcha set', price: '€130', swatch: '#d3d9be', other: 'black', figure: 'copper',
      gallery: [['img/matcha-back.jpg', 'The matcha top turned over: the teardrop cut-out with the NAW logo below, the leggings beside it'], ['img/matcha-front.jpg', 'The matcha NAW set on cream boucle, the top seen from the front, plain'], ['img/matcha-trav.jpg', 'The matcha top and folded leggings on travertine beside an iced matcha'], ['img/matcha-dark.jpg', 'Close-up of the matcha set on black, with the logo on the back of the top']]
    }
  };
  var SIZES = ['S/M', 'M/L'];
  var NOTES = {
    '1': 'Portada 1 · Tríptico: el Black por detrás, NAW is NOW sobre matcha y la chica en Marbella.',
    '2': 'Portada 2 · Partida: el texto sobre matcha a un lado y la chica en Marbella en horizontal, más grande.',
    '3': 'Portada 3 · Banner: la foto horizontal a todo el ancho, con el texto y Shop the drop solo sobre el cielo.'
  };
  // A copy of the site can fix its homepage hero (window.NAW_HERO = '1' | '2' | '3'); then the comparison picker is hidden.
  var FIXED = /^[123]$/.test(String(window.NAW_HERO || '')) ? String(window.NAW_HERO) : null;
  var state = { hero: FIXED || '1', p: 'home', bag: [], bagOpen: false };
  function bagCount() { return state.bag.reduce(function (n, l) { return n + l.qty; }, 0); }
  function priceOf(k) { return Number(P[k].price.replace(/[^\d]/g, '')); }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dbl(p) { return esc(p.first) + ' <em>set</em>'; }
  function desc(p) { return 'Top and leggings in ' + (p.key === 'black' ? 'black' : 'matcha green') + '. The top opens at the back in a drop, with the NAW logo just below it: white letters, ' + p.figure + ' figure. The front is plain. The logo returns on the waistband of the leggings.'; }
  function img(src, alt, cls, lazy) { return '<img src="' + src + '" alt="' + esc(alt || '') + '"' + (cls ? ' class="' + cls + '"' : '') + (lazy === false ? '' : ' loading="lazy"') + ' decoding="async">'; }
  function href(p) { return '#' + (p === 'home' ? 'portada-' + state.hero : p); }

  function chrome(inner) {
    return '<div class="bar">Drop 001 · NAW is NOW</div>' +
      '<header class="hdr"><div class="wrap hdr__in">' +
        '<nav class="hdr__nav label" aria-label="Main"><a href="#shop" data-shop>Shop</a><a href="#black">Black</a><a href="#matcha">Matcha</a></nav>' +

  var app = document.getElementById('app'), note = document.querySelector('[data-note]'), toast = document.querySelector('[data-toast]');

  function parse() {

  function setExpanded() { document.querySelectorAll('[data-bag]').forEach(function (b) { b.setAttribute('aria-expanded', String(state.bagOpen)); }); }
  function openBag(newKey) { renderBag(newKey); placeBag(); state.bagOpen = true; bagp.hidden = false; void bagp.offsetWidth; bagp.classList.add('is-open'); setExpanded(); var c = bagp.querySelector('[data-bag-close]'); if (c && !newKey) c.focus({ preventScroll: true }); }
  function closeBag(focusBack) { if (!state.bagOpen) return; state.bagOpen = false; bagp.classList.remove('is-open'); setExpanded(); if (focusBack) { var b = document.querySelector('[data-bag]'); if (b) b.focus({ preventScroll: true }); } }
  window.addEventListener('scroll', function () { if (state.bagOpen) placeBag(); }, { passive: true });
  window.addEventListener('resize', function () { if (state.bagOpen) placeBag(); });

  document.addEventListener('click', function (e) {
    if (state.bagOpen && !e.target.closest('#bagp') && !e.target.closest('[data-bag]')) closeBag(false);
    var t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.hero) { location.hash = 'portada-' + t.dataset.hero; return; }
    if (t.dataset.p) { location.hash = t.dataset.p === 'home' ? 'portada-' + state.hero : t.dataset.p; return; }
    if (t.dataset.size) { t.parentNode.querySelectorAll('.size').forEach(function (s) { s.setAttribute('aria-pressed', String(s === t)); }); return; }
    if (t.dataset.add) {
      var sz = app.querySelector('.size[aria-pressed="true"]'); var size = sz ? sz.dataset.size : SIZES[0]; var k = t.dataset.add;
      var found = state.bag.filter(function (l) { return l.k === k && l.size === size; })[0];
      if (found) found.qty += 1; else state.bag.push({ k: k, size: size, qty: 1 });

    if (t.hasAttribute('data-bag')) { e.preventDefault(); if (state.bagOpen) closeBag(false); else openBag(); return; }
    if (t.hasAttribute('data-bag-close')) { closeBag(true); return; }
    if (t.dataset.inc) { state.bag[Number(t.dataset.inc)].qty += 1; renderBag(); var b1 = bagp.querySelector('[data-inc="' + t.dataset.inc + '"]'); if (b1) b1.focus({ preventScroll: true }); return; }
    if (t.dataset.dec) { var li = Number(t.dataset.dec); state.bag[li].qty -= 1; if (state.bag[li].qty <= 0) state.bag.splice(li, 1); renderBag(); var b2 = bagp.querySelector('[data-dec="' + t.dataset.dec + '"]'); if (b2) b2.focus({ preventScroll: true }); return; }

    }
  });
  /* ---------- Endless Instagram strip ----------
     Three copies of the same tiles inside one track. The track moves with a GPU transform (sub-pixel, so it glides
     instead of stepping pixel by pixel) and always shows the middle copy: when it drifts one copy away it jumps back
     by exactly one copy, which looks the same, so it never ends. It drifts on its own; drag, swipe or trackpad take
     over, and on release it keeps the throw and eases back into the drift. */
  var loop = null;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DRIFT = 0.042; // px per ms
  function initLoop() {
    var row = app.querySelector('[data-drag]'); if (!row) { loop = null; return; }
    var track = row.querySelector('[data-igtrack]'); var n = IG_TILES.length;
    var L = { row: row, setW: 0, x: 0, v: 0, drag: null, last: 0 };
    function measure() { var a = track.children[0], b = track.children[n]; L.setW = b.offsetLeft - a.offsetLeft; }
    function wrap() {
      if (!L.setW) return;
      while (L.x < L.setW * 0.5) { L.x += L.setW; if (L.drag) L.drag.x0 += L.setW; }
      while (L.x > L.setW * 1.5) { L.x -= L.setW; if (L.drag) L.drag.x0 -= L.setW; }
    }
    function paint() { track.style.transform = 'translate3d(' + (-L.x).toFixed(2) + 'px,0,0)'; }
    measure(); L.x = L.setW; paint();

    row.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      L.drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: L.x, moved: false, lastX: e.clientX, lastT: performance.now(), type: e.pointerType };
      L.v = 0;
    });
    row.addEventListener('pointermove', function (e) {
      var d = L.drag; if (!d || e.pointerId !== d.id) return;
      var dx = e.clientX - d.sx, dy = e.clientY - d.sy;
      if (!d.moved) {
        if (Math.abs(dx) < 6) return;
        if (d.type !== 'mouse' && Math.abs(dy) > Math.abs(dx)) { L.drag = null; return; }
        d.moved = true; row.classList.add('is-drag');
        try { row.setPointerCapture(e.pointerId); } catch (err) {}
      }
      e.preventDefault();
      var now = performance.now(), step = Math.max(1, now - d.lastT);
      L.v = 0.75 * L.v + 0.25 * (-(e.clientX - d.lastX) / step);
      d.lastX = e.clientX; d.lastT = now;
      L.x = d.x0 - dx; wrap(); paint();
    });
    function end(e) {
      var d = L.drag; if (!d || (e && e.pointerId !== d.id)) return; L.drag = null;
      if (d.moved) { row.classList.remove('is-drag'); row.dataset.justDragged = '1'; setTimeout(function () { delete row.dataset.justDragged; }, 0); }
      if (performance.now() - d.lastT > 90) L.v = 0;
      L.v = Math.max(-1.4, Math.min(1.4, L.v));
    }
    row.addEventListener('pointerup', end); row.addEventListener('pointercancel', end); row.addEventListener('lostpointercapture', end);
    row.addEventListener('wheel', function (e) {
      var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0); if (!dx) return;
      e.preventDefault(); L.x += dx; L.v = 0; wrap(); paint();
    }, { passive: false });
    row.addEventListener('click', function (e) { if (row.dataset.justDragged) { e.preventDefault(); e.stopPropagation(); } }, true);
    row.addEventListener('dragstart', function (e) { e.preventDefault(); });
    row.addEventListener('scroll', function () { if (row.scrollLeft) row.scrollLeft = 0; });
    L.measure = measure; loop = L;

    requestAnimationFrame(function tick(now) {
      if (loop !== L || !row.isConnected) return;
      var dt = L.last ? Math.min(50, now - L.last) : 16; L.last = now;
      if (!L.drag && !document.hidden && L.setW) {
        var target = reduceMotion ? 0 : DRIFT;
        L.v += (target - L.v) * (1 - Math.exp(-dt / 320));
        L.x += L.v * dt; wrap(); paint();
      }
      requestAnimationFrame(tick);
    });
  }
  window.addEventListener('resize', function () { if (loop && loop.row.isConnected) { var r = loop.x / (loop.setW || 1); loop.measure(); loop.x = r * loop.setW; } });
  document.addEventListener('submit', function (e) { if (e.target.matches('[data-news]')) { e.preventDefault(); e.target.reset(); say('Thank you · You are on the list'); } });
  document.addEventListener('keydown', function (e) {

  });

  render();
})();
