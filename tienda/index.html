<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>NAW Shop Concepts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:wght@400;500&family=Gruppo&display=swap">
<style>
/* Three shop layouts for NAW, one brand system.
   A Editorial (Alo, Lululemon) · B Esencial (Yeezy) · C Marbella (Homies).
   Bone page, taupe type, ink bands; gold only in the logo and on ink; matcha as a surface with ink text. */
:root {
  --bone: #f1efe9;
  --ink: #141414;
  --taupe: #695440;
  --gold: #c8a35a;
  --stone: #d9d4c8;
  --matcha: #d3d9be;
  --placeholder: #e2dfd6;
  --hair: rgba(20, 20, 20, 0.12);
  --edge: rgba(105, 84, 64, 0.5);
  --on-ink-soft: #9b988f;
  --on-ink-line: rgba(241, 239, 233, 0.16);
  --pick-bg: rgba(20, 20, 20, 0.9);
  --pick-fg: #f1efe9;
  --pick-dim: #9b988f;

  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --label: Gruppo, "Helvetica Neue", Arial, sans-serif;
  --digits: "EB Garamond", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --gut: 32px;
  --wrap: 1280px;
  color-scheme: light;
}
@media (max-width: 599px) { :root { --gut: 18px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bone); color: var(--taupe); font-family: var(--serif); font-size: 19px; font-weight: 500; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bone); }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; scroll-behavior: auto !important; } }

.wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); }
.label { font-family: var(--label); font-size: 14px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; line-height: 1.3; }
.num { font-family: var(--digits); font-variant-numeric: lining-nums tabular-nums; letter-spacing: 0.03em; }
.double { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 0.95; letter-spacing: -0.01em; text-wrap: balance; }
.double em { font-style: italic; }
.note { margin: 0; font-size: 15px; opacity: 0.85; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 28px; border: 1px solid var(--ink); background: var(--ink); color: var(--bone); font-family: var(--label); font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; transition: opacity 0.2s ease, transform 0.12s ease; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn--bone { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.btn--line { background: transparent; color: inherit; border-color: currentColor; }
.btn--full { width: 100%; }
.link { font-family: var(--label); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 5px; background: none; border: 0; padding: 0; }
.media { position: relative; overflow: hidden; background: var(--placeholder); }
.media img { width: 100%; height: 100%; object-fit: cover; }

/* Shared: sizes, swatches, accordions */
.sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.size { min-width: 58px; height: 46px; padding: 0 14px; border: 1px solid var(--edge); background: transparent; font-family: var(--label); font-size: 14px; letter-spacing: 0.16em; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
.size:hover { border-color: var(--taupe); }
.size[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bone); }
.swatches { display: flex; gap: 10px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--hair); box-shadow: 0 0 0 3px var(--bone); position: relative; }
.sw[aria-current="true"] { outline: 1px solid var(--taupe); outline-offset: 4px; }
.acc { border-top: 1px solid var(--hair); }
.acc:last-child { border-bottom: 1px solid var(--hair); }
.acc summary { display: flex; justify-content: space-between; padding: 16px 0; cursor: pointer; list-style: none; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-family: var(--digits); font-size: 20px; letter-spacing: 0; line-height: 1; }
.acc[open] summary::after { content: "\2212"; }
.acc p { margin: 0 0 16px; font-size: 17px; }

/* Picker (preview only) */
.pick { position: fixed; z-index: 80; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: calc(100% - 24px); padding: 6px; border-radius: 999px; background: var(--pick-bg); color: var(--pick-fg); font: 13px/1.2 var(--ui); box-shadow: 0 10px 30px rgba(20, 20, 20, 0.25); backdrop-filter: blur(8px); }
.pick__group { display: flex; gap: 2px; }
.pick__sep { width: 1px; height: 20px; background: var(--on-ink-line); }
.pick button { border: 0; background: transparent; color: var(--pick-dim); padding: 8px 12px; border-radius: 999px; white-space: nowrap; transition: background-color 0.15s ease, color 0.15s ease; }
.pick button:hover { color: var(--pick-fg); }
.pick button[aria-pressed="true"] { background: var(--pick-fg); color: var(--ink); }
.pick__note { position: fixed; z-index: 79; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 8px 14px; border-radius: 10px; background: var(--pick-bg); color: var(--pick-fg); font: 12.5px/1.4 var(--ui); text-align: center; transition: opacity 0.4s ease, transform 0.4s ease; }
.pick__note.is-off { opacity: 0; transform: translate(-50%, 6px); pointer-events: none; }
@media (max-width: 599px) { .pick { border-radius: 18px; } .pick button { padding: 8px 9px; } .pick__note { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); } }
.toast { position: fixed; z-index: 81; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -12px); opacity: 0; padding: 12px 18px; background: var(--ink); color: var(--bone); font-family: var(--label); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
main { padding-bottom: 96px; }
.view-enter { animation: viewIn 0.35s ease both; }
@keyframes viewIn { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- A · Editorial ---------- */
.va .bar { background: var(--matcha); color: var(--ink); text-align: center; padding: 9px 16px; font-family: var(--label); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; }
.va .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bone); border-bottom: 1px solid var(--hair); }
.va .hdr__in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; }
.va .hdr__nav { display: flex; gap: 24px; }
.va .hdr__nav a:hover, .va .hdr__bag:hover { opacity: 0.65; }
.va .hdr__logo img { height: 26px; width: auto; }
.va .hdr__bag { justify-self: end; }
.va .hero { display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 560px; }
.va .hero .media { min-height: 420px; }
.va .hero__mid { background: var(--matcha); color: var(--ink); display: grid; align-content: center; justify-items: center; gap: 22px; padding: 48px 28px; text-align: center; }
.va .hero__mid .double { font-size: clamp(44px, 4.6vw, 72px); }
.va .tiles { padding-block: 64px 16px; }
.va .tiles__row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.va .tile { display: grid; gap: 14px; text-align: center; }
.va .tile .media { aspect-ratio: 4 / 5; }
.va .tile img { transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1); }
@media (hover: hover) { .va .tile:hover img { transform: scale(1.03); } }
.va .sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 24px; }
.va .sec-h .double { white-space: nowrap; }
.va .sec-h .double { font-size: clamp(34px, 3.4vw, 52px); }
.va .prods { padding-block: 56px 72px; }
.va .prods__row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.va .card { display: grid; gap: 14px; }
.va .card .media { aspect-ratio: 4 / 5; }
.va .card .alt { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; }
@media (hover: hover) { .va .card:hover .alt { opacity: 1; } }
.va .card__meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: baseline; }
.va .card__meta .swatches { grid-column: 1 / -1; }
.va .card__t { margin: 0; font-size: 30px; font-weight: 400; line-height: 1; }
.va .card__t em { font-style: italic; }
.va .story { display: grid; grid-template-columns: 1.2fr 1fr; background: var(--ink); color: var(--bone); }
.va .story .media { min-height: 520px; }
.va .story__txt { display: grid; align-content: center; gap: 22px; padding: 56px max(var(--gut), 6vw); }
.va .story__txt .label:first-child { color: var(--gold); }
.va .story__txt .double { font-size: clamp(46px, 5vw, 80px); }
.va .vals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; padding-block: 64px; }
.va .vals p { margin: 8px 0 0; font-size: 22px; line-height: 1.25; }
.va .pdp { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); padding-block: 20px 72px; }
.va .gal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.va .gal .media { aspect-ratio: 4 / 5; }
.va .info { position: sticky; top: 96px; align-self: start; display: grid; gap: 20px; }
.va .info .double { font-size: clamp(44px, 4.4vw, 64px); }
.va .crumbs { margin-bottom: 6px; }
.va .row { display: flex; justify-content: space-between; align-items: baseline; }
@media (max-width: 899px) {
  .va .hdr__nav { display: none; }
  .va .hdr__menu { display: inline-block !important; }
  .va .hero { grid-template-columns: 1fr 1fr; min-height: 0; }
  .va .hero__mid { grid-column: 1 / -1; order: -1; }
  .va .hero .media { min-height: 0; aspect-ratio: 4 / 5; }
  .va .tiles__row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .va .story { grid-template-columns: 1fr; }
  .va .story .media { min-height: 0; aspect-ratio: 4 / 5; }
  .va .vals { grid-template-columns: 1fr; gap: 22px; }
  .va .pdp { grid-template-columns: 1fr; padding-top: 0; }
  .va .pdp > .gal { margin-inline: calc(-1 * max(var(--gut), env(safe-area-inset-left, 0px))); display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; scrollbar-width: none; }
  .va .pdp > .gal .media { flex: 0 0 86%; scroll-snap-align: start; }
  .va .info { position: static; }
}
@media (max-width: 599px) { .va .prods__row { grid-template-columns: 1fr; gap: 40px; } }
.hdr__menu { display: none; }

/* ---------- B · Esencial ---------- */
.vb { background: var(--bone); }
.vb .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bone); }
.vb .hdr__in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; }
.vb .hdr__logo img { height: 20px; width: auto; }
.vb .filters { display: flex; gap: 22px; }
.vb .filters button { border: 0; background: none; padding: 8px 0; font-family: var(--label); font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--edge); transition: color 0.15s ease; }
.vb .filters button[aria-pressed="true"] { color: var(--taupe); }
.vb .hdr__bag { justify-self: end; font-size: 13px; }
.vb .grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 48px 32px; max-width: 920px; margin: 0 auto; padding-block: clamp(40px, 7vw, 96px) 64px; }
.vb .item { display: grid; justify-items: center; gap: 18px; text-align: center; }
.vb .fig { position: relative; width: 100%; max-width: 300px; transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }
@media (hover: hover) { .vb .item:hover .fig { transform: translateY(-4px); } }
.vb .fig img, .vb .outfit img { transition: opacity 0.4s ease; }
.vb .fig--single { aspect-ratio: 3 / 4; display: grid; place-items: center; }
.vb .fig--single img { max-height: 100%; max-width: 86%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(20, 20, 20, 0.08)); }
.vb .outfit { position: relative; width: 100%; aspect-ratio: 5 / 9; }
.vb .outfit .top { position: absolute; left: 50%; top: 0; width: 66%; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(20, 20, 20, 0.08)); }
.vb .outfit .top.back { opacity: 0; }
.vb .outfit .legs { position: absolute; left: 50%; bottom: 0; height: 58%; width: auto; max-width: none; transform: translateX(-50%); filter: drop-shadow(0 8px 12px rgba(20, 20, 20, 0.08)); }
@media (hover: hover) { .vb .item:hover .top.front { opacity: 0; } .vb .item:hover .top.back { opacity: 1; } }
.vb .item .label { font-size: 12px; }
.vb .item .num { font-size: 15px; }
.vb .ftr { display: grid; justify-items: center; gap: 18px; padding-block: 24px 40px; padding-left: max(var(--gut), env(safe-area-inset-left, 0px)); padding-right: max(var(--gut), env(safe-area-inset-right, 0px)); text-align: center; }
.fig9 { font-family: var(--digits); font-style: normal; font-size: 0.9em; letter-spacing: 0.04em; }
@media (max-width: 599px) { .vb .pdp .outfit { max-width: 250px; } }
.vb .ftr__links { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-family: var(--label); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
.vb .sub { display: grid; gap: 8px; width: min(380px, 100%); }
.vb .sub input { height: 44px; padding: 0 12px; border: 1px solid var(--edge); background: transparent; font-family: var(--label); font-size: 13px; letter-spacing: 0.16em; }
.vb .sub .btn { min-height: 44px; }
.vb .pdp { display: grid; justify-items: center; gap: 22px; max-width: 520px; margin: 0 auto; padding-block: 24px 48px; text-align: center; }
.vb .pdp .outfit { max-width: 330px; }
.vb .pdp .outfit.is-back .top.front { opacity: 0; }
.vb .pdp .outfit.is-back .top.back { opacity: 1; }
.vb .dots { display: flex; gap: 18px; }
.vb .dots button { border: 0; background: none; padding: 6px 0; font-family: var(--label); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--edge); }
.vb .dots button[aria-pressed="true"] { color: var(--taupe); text-decoration: underline; text-underline-offset: 6px; }
.vb .pdp .double { font-size: 34px; }
.vb .pdp .sizes { justify-content: center; }
.vb .pdp .size { min-width: 52px; height: 40px; font-size: 13px; }
.vb .pdp .btn { width: min(340px, 100%); min-height: 46px; }
.vb .back { justify-self: start; margin-left: max(var(--gut), env(safe-area-inset-left, 0px)); }
.vb details.info { width: min(340px, 100%); }
.vb details.info summary { list-style: none; cursor: pointer; font-family: var(--label); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; }
.vb details.info summary::-webkit-details-marker { display: none; }
.vb details.info p { margin: 12px 0 0; font-size: 16px; }
@media (max-width: 599px) { .vb .grid { gap: 36px 14px; } .vb .filters { gap: 14px; } .vb .hdr__in { grid-template-columns: auto 1fr auto; } .vb .filters { justify-content: center; } }

/* ---------- C · Marbella ---------- */
.vc .bar { background: var(--ink); color: var(--bone); overflow: hidden; white-space: nowrap; padding: 9px 0; font-family: var(--label); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; }
.vc .bar__track { display: inline-flex; gap: 48px; padding-left: 48px; animation: marquee 28s linear infinite; }
@keyframes marquee { to { transform: translateX(-50%); } }
.vc .hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bone); border-bottom: 1px solid var(--hair); }
.vc .hdr__in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; }
.vc .hdr__logo img { height: 26px; width: auto; }
.vc .hdr__bag { justify-self: end; }
.vc .hero { position: relative; height: min(78vh, 760px); min-height: 460px; color: var(--bone); }
.vc .hero .media { position: absolute; inset: 0; }
.vc .hero .media img { object-position: 50% 30%; }
.vc .hero__txt { position: absolute; inset: auto 0 12%; display: grid; justify-items: center; gap: 22px; text-align: center; padding-inline: 16px; text-shadow: 0 1px 18px rgba(20, 20, 20, 0.35); }
.vc .hero__txt .double { font-size: clamp(64px, 10vw, 140px); }
.vc .intro { display: grid; justify-items: center; gap: 12px; padding-block: 48px 32px; text-align: center; }
.vc .intro .double { font-size: clamp(30px, 3vw, 44px); }
.vc .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
.vc .pcard { display: grid; gap: 14px; padding-bottom: 28px; text-align: center; background: var(--bone); }
.vc .pcard__img { position: relative; aspect-ratio: 1 / 1; background: var(--stone); display: grid; place-items: center; overflow: hidden; }
.vc .pcard__img img { position: absolute; top: 50%; transition: opacity 0.4s ease; filter: drop-shadow(0 10px 14px rgba(20, 20, 20, 0.1)); }
.vc .pcard__img .main, .vc .pcard__img .alt { left: 9%; width: 50%; transform: translateY(-58%); }
.vc .pcard__img .alt { opacity: 0; }
.vc .pcard__img .l { right: 13%; height: 84%; width: auto; max-width: none; transform: translateY(-50%); }
.vc .pcard__sizes { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 14px; font-family: var(--label); font-size: 12px; letter-spacing: 0.18em; opacity: 0; transform: translateY(6px); transition: opacity 0.3s ease, transform 0.3s ease; }
@media (hover: hover) { .vc .pcard:hover .pcard__img .main { opacity: 0; } .vc .pcard:hover .pcard__img .alt { opacity: 1; } .vc .pcard:hover .pcard__sizes { opacity: 1; transform: none; } }
.vc .pcard__name { font-family: var(--label); font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; }
.vc .pcard .num { font-size: 18px; margin-top: -8px; }
.vc .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 3px; }
.vc .coltile { position: relative; aspect-ratio: 4 / 5; color: var(--bone); }
.vc .coltile .media { position: absolute; inset: 0; }
.vc .coltile .btn { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); }
.vc .banner { position: relative; height: min(70vh, 640px); min-height: 380px; color: var(--bone); margin-top: 3px; }
.vc .banner .media { position: absolute; inset: 0; }
.vc .banner .media img { object-position: 50% 60%; }
.vc .banner__txt { position: absolute; inset: auto 0 10%; display: grid; justify-items: center; gap: 14px; text-align: center; padding-inline: 16px; text-shadow: 0 1px 18px rgba(20, 20, 20, 0.35); }
.vc .banner__txt .double { font-size: clamp(40px, 5.4vw, 84px); }
.vc .ig { padding-block: 56px 24px; }
.vc .ig__h { display: grid; justify-items: center; gap: 10px; text-align: center; margin-bottom: 24px; }
.vc .ig__h .double { font-size: clamp(30px, 3vw, 44px); }
.vc .ig__row { display: flex; gap: 3px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-inline: max(var(--gut), env(safe-area-inset-left, 0px)); }
.vc .ig__row::-webkit-scrollbar { display: none; }
.vc .ig__row .media { flex: 0 0 clamp(200px, 22vw, 300px); aspect-ratio: 4 / 5; scroll-snap-align: start; }
.vc .ftr { background: var(--ink); color: var(--bone); margin-top: 56px; }
.vc .ftr__in { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding-block: 56px 32px; }
.vc .news { display: grid; gap: 14px; max-width: 460px; }
.vc .news .double { font-size: clamp(32px, 3vw, 44px); }
.vc .news__row { display: flex; gap: 8px; }
.vc .news input { flex: 1; min-width: 0; height: 50px; padding: 0 2px; border: 0; border-bottom: 1px solid var(--on-ink-line); background: transparent; color: var(--bone); font-size: 18px; }
.vc .news input::placeholder { color: var(--on-ink-soft); }
.vc .ftr__cols { display: flex; flex-wrap: wrap; gap: 40px; }
.vc .ftr__cols div { display: grid; gap: 8px; align-content: start; }
.vc .ftr__cols .label { color: var(--on-ink-soft); font-size: 12px; }
.vc .ftr__base { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 20px 28px; border-top: 1px solid var(--on-ink-line); color: var(--on-ink-soft); font-family: var(--label); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; }
.vc .pdp { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); padding-block: 28px 72px; }

    var v = V[h[0]] ? h[0] : 'a';
    var p = (h[1] === 'black' || h[1] === 'matcha') ? h[1] : 'home';
    return { v: v, p: p };
  }
  function render(keepScroll) {
    var r = parse(); var changed = r.v !== state.v || r.p !== state.p;
    state.v = r.v; state.p = r.p;
    app.innerHTML = state.p === 'home' ? V[state.v].home() : V[state.v].pdp(state.p);
    app.classList.remove('view-enter'); void app.offsetWidth; app.classList.add('view-enter');
    document.querySelectorAll('[data-v]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.v)); });
    document.querySelectorAll('[data-p]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.p === state.p)); });
    if (note.textContent !== NOTES[state.v]) {
      note.textContent = NOTES[state.v]; note.classList.remove('is-off');
      clearTimeout(noteTimer); noteTimer = setTimeout(function () { note.classList.add('is-off'); }, 5000);
    }
    if (changed && !keepScroll) window.scrollTo(0, 0);
  }
  function say(msg) { toast.textContent = msg; toast.classList.add('is-on'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove('is-on'); }, 1800); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); if (!t) return;
    if (t.dataset.v) { location.hash = go(t.dataset.v, state.p); return; }
    if (t.dataset.p) { location.hash = go(state.v, t.dataset.p); return; }
    if (t.dataset.filter) { state.filter = t.dataset.filter; render(true); return; }
    if (t.dataset.size) { var g = t.closest('.sizes'); g.querySelectorAll('.size').forEach(function (s) { s.setAttribute('aria-pressed', String(s === t)); }); return; }
    if (t.dataset.add) {
      var sz = (app.querySelector('.size[aria-pressed="true"]') || {}).dataset; state.bag += 1;
      app.querySelectorAll('[data-bagn]').forEach(function (n) { n.textContent = state.bag; });
      say('Added · ' + P[t.dataset.add].title + (sz ? ' · ' + sz.size : '')); return;
    }
    if (t.hasAttribute('data-bag')) { e.preventDefault(); say(state.bag ? 'Bag · ' + state.bag + (state.bag === 1 ? ' set' : ' sets') : 'Your bag is empty'); return; }
    if (t.dataset.view) { var of = app.querySelector('.pdp .outfit'); of.classList.toggle('is-back', t.dataset.view === 'back'); t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); return; }
    if (t.dataset.thumb) {
      var st = app.querySelector('[data-stage]'); var views = JSON.parse(st.dataset.views); var v = views[Number(t.dataset.thumb)];
      st.innerHTML = img(v.src, v.alt, v.cut ? '' : 'photo', false);
      t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); return;
    }
    if (t.dataset.scroll) { var el = document.getElementById(t.dataset.scroll); if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
    var href = t.getAttribute('href') || '';
    if (/^#[abc](-[a-z]+)?#shop$/.test(href)) { e.preventDefault(); var hv = href.slice(1).split('#')[0]; if (location.hash.slice(1) !== hv) { location.hash = hv; } setTimeout(function () { var s = document.getElementById('shop'); if (s) s.scrollIntoView({ behavior: 'smooth' }); }, 60); }
  });
  document.addEventListener('submit', function (e) { if (e.target.matches('[data-news]')) { e.preventDefault(); e.target.reset(); say('Thank you · You are on the list'); } });
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) return;
    var map = { '1': 'a', '2': 'b', '3': 'c' };
    if (map[e.key]) location.hash = go(map[e.key], state.p);
  });
  window.addEventListener('hashchange', function () { render(false); });
  render(false);
})();
